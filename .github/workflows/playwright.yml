name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite a ejecutar'
        type: choice
        default: green
        options: [green, fail, all, eval]  # eval: mide el acierto de la IA con los escenarios de fallo

permissions:
  contents: read

env:
  TZ: 'Europe/Madrid'
  HOME: /root  # Firefox no arranca si $HOME no pertenece al usuario actual; /github/home es de otro UID

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    if: github.event.inputs.suite != 'eval'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Determine grep filter
        id: suite
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'green' }}" in
            green) echo "grep=--grep-invert @demo-fail" >> "$GITHUB_OUTPUT" ;;
            fail)  echo "grep=--grep @demo-fail"        >> "$GITHUB_OUTPUT" ;;
            all)   echo "grep="                          >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} ${{ steps.suite.outputs.grep }}

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-json-${{ matrix.browser }}
          path: test-results.json
          retention-days: 1

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (failures)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Reglas de Playwright sin IA (eslint-plugin-playwright). Falla con cualquier error o si aparece un
  # aviso más de los que ya hay (--max-warnings en package.json): la deuda no puede crecer.
  lint:
    name: Lint de Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOME: /home/runner  # fuera del contenedor de Playwright: el HOME=/root global no es accesible y rompe el checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: ESLint (eslint-plugin-playwright)
        run: npm run lint

  # Un solo reporte IA por ejecución con los resultados de los tres navegadores:
  # 4 llamadas como mucho en lugar de 4 por navegador, y los navegadores ya pueden ir en paralelo.
  report:
    name: Reporte IA
    needs: test
    if: always() && github.event.inputs.suite != 'eval'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy  # mismo Node que los tests; además HOME=/root solo vale dentro del contenedor
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (triage del reporte IA)
        run: npm run test:unit

      - name: Download test results JSON
        uses: actions/download-artifact@v4
        with:
          pattern: results-json-*
          path: results-json

      - name: Unir los resultados de los tres navegadores
        run: node scripts/merge-results.mjs test-results.json results-json/*/test-results.json

      - name: Generate AI report
        continue-on-error: true  # cuota Gemini free tier es inestable; no debe tumbar el run si los tests pasan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # En push y PR no se gasta cuota de IA solo por tests flaky; a mano (workflow_dispatch), sí.
          AI_SKIP_FLAKY_ONLY: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
        run: npm run report:ai

      - name: Show AI summary
        if: always()
        run: |
          echo "## AI Test Report Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/ai-summary.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat playwright-report/ai-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_AI summary not generated — check the 'Generate AI report' step for details._" >> $GITHUB_STEP_SUMMARY
          fi

      # Tickets de los bug_producto. Sin los secretos JIRA_* es modo simulado: deja las peticiones
      # en ai-jira.json, dentro del artefacto ai-report, y no envía nada.
      - name: Tickets de Jira
        if: always()
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: npm run jira:tickets

      # Solo lee los ficheros que ya hay (sin IA ni tests): queda dentro del artefacto ai-report.
      - name: Dashboard QA Intelligence
        if: always()
        continue-on-error: true
        run: npm run dashboard

      - name: Upload AI report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-report
          path: playwright-report/
          retention-days: 30

  eval:
    name: Acierto de la IA
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'eval'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Evaluar la clasificación de la IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run eval:ai

      - name: Show AI eval
        if: always()
        run: |
          if [ -f playwright-report/ai-eval.md ]; then
            cat playwright-report/ai-eval.md >> $GITHUB_STEP_SUMMARY
          else
            echo "_ai-eval.md no generado — revisa el paso 'Evaluar la clasificación de la IA'._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dashboard QA Intelligence
        if: always()
        continue-on-error: true
        run: npm run dashboard

      - name: Upload AI eval
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval
          path: playwright-report/
          retention-days: 30
