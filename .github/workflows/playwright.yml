name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite a ejecutar'
        type: choice
        default: green
        options: [green, fail, all, eval]  # eval: mide el acierto de la IA con los escenarios de fallo
      scenario:
        description: 'Escenario de fallo de la demo (DEMO_SCENARIO). Excluye @demo-fail y @a11y'
        type: choice
        default: ninguno
        options: [ninguno, cascade, bug, flaky, env]
      heal:
        description: 'Lanzar el healer sobre los grupos test_roto y abrir una PR en borrador'
        type: boolean
        default: false

permissions:
  contents: read

env:
  TZ: 'Europe/Madrid'
  HOME: /root  # Firefox no arranca si $HOME no pertenece al usuario actual; /github/home es de otro UID
  # Vacío salvo que se elija un escenario al lanzar a mano: sin la variable, la suite se comporta igual.
  DEMO_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario != 'ninguno' && inputs.scenario || '' }}

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    if: github.event.inputs.suite != 'eval'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Determine grep filter
        id: suite
        run: |
          # Con un escenario, lo mismo que npm run test:scenario:*: sin @demo-fail ni @a11y.
          if [ -n "$DEMO_SCENARIO" ]; then echo 'grep=--grep-invert "@demo-fail|@a11y"' >> "$GITHUB_OUTPUT"; exit 0; fi
          case "${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'green' }}" in
            green) echo "grep=--grep-invert @demo-fail" >> "$GITHUB_OUTPUT" ;;
            fail)  echo "grep=--grep @demo-fail"        >> "$GITHUB_OUTPUT" ;;
            all)   echo "grep="                          >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} ${{ steps.suite.outputs.grep }}

      - name: Upload test results JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: results-json-${{ matrix.browser }}
          path: test-results.json
          retention-days: 1

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (failures)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Reglas de Playwright sin IA (eslint-plugin-playwright). Falla con cualquier error o si aparece un
  # aviso más de los que ya hay (--max-warnings en package.json): la deuda no puede crecer.
  lint:
    name: Lint de Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOME: /home/runner  # fuera del contenedor de Playwright: el HOME=/root global no es accesible y rompe el checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint (eslint-plugin-playwright)
        run: npm run lint

  # Un solo reporte IA por ejecución con los resultados de los tres navegadores:
  # 4 llamadas como mucho en lugar de 4 por navegador, y los navegadores ya pueden ir en paralelo.
  report:
    name: Reporte IA
    needs: test
    if: always() && github.event.inputs.suite != 'eval'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy  # mismo Node que los tests; además HOME=/root solo vale dentro del contenedor
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests (triage del reporte IA)
        run: npm run test:unit

      - name: Download test results JSON
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: results-json-*
          path: results-json

      # La instantánea de la página en el fallo (error-context.md) vive en test-results/. Sin ella la IA
      # no ve que el elemento sigue en la página y confunde un test roto con un problema de entorno.
      # test-results.json la cita por ruta absoluta, que es la misma en este contenedor.
      # Trae también trazas y vídeos: con los secretos JIRA_*, jira:tickets los adjunta sin redactar.
      - name: Download test results (failures)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Unir los resultados de los tres navegadores
        run: node scripts/merge-results.mjs test-results.json results-json/*/test-results.json

      - name: Generate AI report
        continue-on-error: true  # la cuota gratuita de IA es inestable; no debe tumbar el run si los tests pasan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # OpenRouter manda si existe el secreto; si no, Gemini. El modelo, en la variable AI_MODEL del repositorio.
          AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_BASE_URL: https://openrouter.ai/api/v1
          AI_MODEL: ${{ vars.AI_MODEL }}
          # En push y PR no se gasta cuota de IA solo por tests flaky; a mano (workflow_dispatch), sí.
          AI_SKIP_FLAKY_ONLY: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
        run: npm run report:ai

      - name: Show AI summary
        if: always()
        run: |
          echo "## AI Test Report Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/ai-summary.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat playwright-report/ai-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_AI summary not generated — check the 'Generate AI report' step for details._" >> $GITHUB_STEP_SUMMARY
          fi

      # Tickets de los bug_producto. Sin los secretos JIRA_* es modo simulado: deja las peticiones
      # en ai-jira.json, dentro del artefacto ai-report, y no envía nada.
      - name: Tickets de Jira
        if: always()
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          # Variable del repositorio (no secreto): el tipo de incidencia depende del proyecto (THP usa Tarea).
          # Sin ella llegaría vacía y jira-tickets.mjs no aplicaría su valor por defecto.
          JIRA_ISSUE_TYPE: ${{ vars.JIRA_ISSUE_TYPE || 'Bug' }}
        run: npm run jira:tickets

      # Solo lee los ficheros que ya hay (sin IA ni tests): queda dentro del artefacto ai-report.
      - name: Dashboard QA Intelligence
        if: always()
        continue-on-error: true
        run: npm run dashboard

      - name: Upload AI report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ai-report
          path: playwright-report/
          retention-days: 30

  # Fase 4 en CI: el healer cura los grupos test_roto del reporte y abre una PR en borrador.
  # Solo a mano (heal: true), nunca en push ni en PR: gasta cuota de la suscripción de Claude y abre PR.
  # Las PR que abre GITHUB_TOKEN no disparan otros workflows: para que corran los tests y el guard,
  # una persona cierra y reabre la PR. El check de asserts y la revisión adversarial ya van dentro de heal:ai.
  heal:
    name: Healer (PR en borrador)
    needs: [test, report]
    # Solo si fallaron tests: sin fallos no hay ai-failures-grouped.json y no hay nada que curar.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.heal && inputs.suite != 'eval' && needs.test.result == 'failure'
    # Fuera del contenedor: hace falta gh, que la imagen de Playwright no trae. Fijado a 24.04 porque
    # ubuntu-latest ya es 26.04 y Playwright 1.58 no tiene navegadores para esa versión.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write        # rama heal/* y push
      pull-requests: write   # PR en borrador
      issues: write          # etiqueta needs-human
    env:
      HOME: /home/runner  # fuera del contenedor el HOME=/root global no es accesible

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Sin el token en .git/config, el healer no lo puede leer. El paso de publicar lo pasa solo al push.
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # El healer ejecuta los tests afectados para comprobar su arreglo.
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: Download AI report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ai-report
          path: playwright-report

      - name: Identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Dos pasos para que GH_TOKEN no exista en ningún proceso mientras corren los agentes: con Write y
      # test_run, el healer podría ejecutar un test que lea el entorno de sus procesos padre (/proc/<pid>/environ).
      - name: Healer (sin GH_TOKEN)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run heal:ai -- --no-publish

      - name: Push y PR en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run heal:ai -- --publish

      - name: Show healer result
        if: always()
        run: |
          echo "## Healer" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/ai-heal.json ]; then
            node -e "const h=require('./playwright-report/ai-heal.json');for(const e of h.heals??[])console.log('- '+e.groups.join(', ')+': '+(e.pr??'sin cambios, no hay PR')+(e.needs_human?' · needs-human':''))" >> $GITHUB_STEP_SUMMARY
          else
            echo "_Sin ai-heal.json: no había grupos test_roto o el healer falló (revisa los pasos 'Healer' y 'Push y PR')._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload healer result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ai-heal
          path: playwright-report/ai-heal.json
          if-no-files-found: ignore
          retention-days: 30

  eval:
    name: Acierto de la IA
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'eval'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
    timeout-minutes: 45
    env:
      DEMO_SCENARIO: ''  # eval:ai pone el escenario de cada ejecución; el de la entrada no debe colarse

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Evaluar la clasificación de la IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # OpenRouter manda si existe el secreto; si no, Gemini. El modelo, en la variable AI_MODEL del repositorio.
          AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_BASE_URL: https://openrouter.ai/api/v1
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: npm run eval:ai

      - name: Show AI eval
        if: always()
        run: |
          if [ -f playwright-report/ai-eval.md ]; then
            cat playwright-report/ai-eval.md >> $GITHUB_STEP_SUMMARY
          else
            echo "_ai-eval.md no generado — revisa el paso 'Evaluar la clasificación de la IA'._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dashboard QA Intelligence
        if: always()
        continue-on-error: true
        run: npm run dashboard

      - name: Upload AI eval
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ai-eval
          path: playwright-report/
          retention-days: 30
