# SonarQube Cloud: análisis desde CI (.github/workflows/sonar.yml), no el Automatic Analysis.
sonar.projectKey=StoneFly365_playwright-demo-ia-mcp
sonar.organization=stonefly365

# Código fuente: todo el repositorio menos material formativo, documentación, salidas y los tests.
# Los tests van aparte en sonar.tests: un fichero no puede estar en los dos lados.
sonar.sources=.
sonar.exclusions=node_modules/**,learning/**,docs-site/**,docs/**,playwright-report/**,test-results/**,coverage/**,tests/**,**/*.test.mjs

sonar.tests=scripts,tests
sonar.test.inclusions=scripts/**/*.test.mjs,tests/**

# Cobertura de los tests unitarios (npm run test:unit:coverage). Solo tiene sentido en scripts/:
# tests/, pages/ y fixtures/ son E2E y no los ejecuta node --test.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tests/**,pages/**,fixtures/**

