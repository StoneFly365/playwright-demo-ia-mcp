# SonarQube Cloud: análisis desde CI (.github/workflows/sonar.yml), no el Automatic Analysis.
# TODO: rellenar con la clave del proyecto y de la organización que se creen en sonarcloud.io.
sonar.projectKey=TODO_PROJECT_KEY
sonar.organization=TODO_ORGANIZATION

# Código fuente: todo el repositorio menos material formativo, documentación, salidas y los tests.
# Los tests van aparte en sonar.tests: un fichero no puede estar en los dos lados.
sonar.sources=.
sonar.exclusions=node_modules/**,learning/**,docs-site/**,docs/**,playwright-report/**,test-results/**,coverage/**,tests/**,**/*.test.mjs

sonar.tests=scripts,tests
sonar.test.inclusions=scripts/**/*.test.mjs,tests/**

# Cobertura de los tests unitarios (npm run test:unit:coverage). Solo tiene sentido en scripts/:
# tests/, pages/ y fixtures/ son E2E y no los ejecuta node --test.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tests/**,pages/**,fixtures/**

# 'secret_sauce' es la contraseña pública de SauceDemo (sale en su página de login), no un secreto.
# Se ignora la regla de credenciales en el código de los tests E2E, y solo ahí.
# TODO: comprobar tras el primer análisis; si S2068 sale como Security Hotspot y no como incidencia,
# esta exclusión no le aplica y hay que marcarlos como "Safe" en la interfaz.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=pages/**
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=fixtures/**
