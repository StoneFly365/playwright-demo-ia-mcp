# SonarQube Cloud: análisis desde CI (.github/workflows/sonar.yml), no el Automatic Analysis.
# Pon aquí la clave y la organización del proyecto en SonarQube.
sonar.projectKey=CAMBIAR
sonar.organization=CAMBIAR

# SonarQube Cloud analiza todo el repositorio: sonar.sources, sonar.tests y sonar.test.inclusions
# ya no tienen efecto (lo avisa el scanner). El alcance se recorta solo con sonar.exclusions.
# Fuera: documentación, salidas y los tests (los E2E los revisan el lint y el
# check de asserts; los unitarios aportan la cobertura).
sonar.exclusions=node_modules/**,docs/**,playwright-report/**,test-results/**,coverage/**,tests/**,**/*.test.mjs

# Cobertura de los tests unitarios (npm run test:unit:coverage). Solo tiene sentido en scripts/:
# tests/, pages/ y fixtures/ son E2E y no los ejecuta node --test.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tests/**,pages/**,fixtures/**

