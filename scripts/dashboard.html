<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sin conexiones: default-src 'none' bloquea fetch, XHR, imágenes y recursos remotos. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>QA Intelligence</title>
<style>
/* Tema oscuro único: la página se enseña en demos y se abre sin servidor. Cada color tiene una función fija. */
:root {
  color-scheme: dark;
  --bg: #0b1020; --bg-2: #111827; --panel: #151d30; --panel-2: #1a2338; --panel-3: #0f1628;
  --line: #273449; --line-2: #354660; --text: #f1f5f9; --muted: #94a3b8; --faint: #8294ab;
  /* Funciones: azul = principal, cian = dato técnico y determinista, violeta = IA, verde = éxito, ámbar = aviso, coral = fallo. */
  --blue: #3b82f6; --blue-t: #60a5fa; --cyan: #22d3ee; --violet: #a78bfa; --green: #34d399; --amber: #fbbf24; --coral: #fb7185; --slate: #94a3b8;
  /* Categorías: el mismo color en todas las vistas. */
  --test_roto: #ff8a6b; --bug_producto: #f9578a; --entorno: #fbbf24; --flaky: #c084fc; --sin_clasificar: #94a3b8;
  --radius: 14px; --mono: ui-monospace, "Cascadia Code", SFMono-Regular, Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--text); font: 15px/1.55 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  background: radial-gradient(1200px 500px at 15% -10%, rgba(59, 130, 246, .12), transparent 60%), radial-gradient(900px 400px at 95% -5%, rgba(167, 139, 250, .10), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
::selection { background: rgba(34, 211, 238, .3); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
code { font: 12.5px var(--mono); color: #cbd5e1; background: rgba(148, 163, 184, .12); padding: 1px 5px; border-radius: 4px; }
a { color: var(--blue-t); }

.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cabecera */
header { position: sticky; top: 0; z-index: 5; background: rgba(11, 16, 32, .82); backdrop-filter: saturate(140%) blur(12px); border-bottom: 1px solid var(--line); }
.bar, .tabs { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-top: 14px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--blue) 0%, #6d5dfc 55%, var(--violet) 100%); box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset, 0 6px 20px -6px rgba(99, 102, 241, .7); }
.logo .ic { width: 21px; height: 21px; }
.brand h1 { font-size: 17px; line-height: 1.15; margin: 0; letter-spacing: -.01em; font-weight: 700; }
.brand .tagline { font-size: 12px; color: var(--muted); }
.brand .tagline b { font-weight: 600; background: linear-gradient(90deg, var(--violet), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.spacer { flex: 1; }
.runbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; }
.runbox .when { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.runbox label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px 11px; font-size: 13.5px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.tabs a:hover { color: var(--text); }
.tabs a.active { color: var(--text); border-bottom-color: var(--cyan); }
.tabs a.active .ic { color: var(--cyan); }

/* Controles */
select, input { font: inherit; font-size: 14px; color: var(--text); background: var(--panel-3); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
select:hover, input:hover { border-color: var(--line-2); }
select:focus, input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, .18); }
input::placeholder { color: var(--faint); }
button { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s; }
button:hover { background: #222d47; border-color: var(--line-2); }

/* Insignias */
.pill { --c: var(--slate); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.pill .ic { width: 13px; height: 13px; }
.pill.safe { --c: var(--green); }
.pill.demo { --c: var(--amber); white-space: normal; }
.status { font-weight: 600; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.chip { --c: var(--sin_clasificar); display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1.7 var(--mono); padding: 0 8px; border-radius: 6px; white-space: nowrap;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 34%, transparent); }
.chip .ic { width: 13px; height: 13px; }
.o { --c: var(--slate); display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 0 7px; line-height: 1.75; border-radius: 6px; white-space: nowrap;
  color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.o .ic { width: 12px; height: 12px; }
.o-codigo { --c: var(--cyan); background: rgba(34, 211, 238, .06); }
.o-ia { --c: var(--violet); background: linear-gradient(90deg, rgba(167, 139, 250, .16), rgba(34, 211, 238, .08)); }
.o-ninguno { border-style: dashed; }
.review { --c: var(--amber); }
.br { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); background: rgba(148, 163, 184, .08); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; line-height: 1.7; white-space: nowrap; }
.br .ic { width: 12px; height: 12px; color: var(--cyan); }
.conf { --c: var(--slate); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.conf .bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.conf .bars i { width: 4px; border-radius: 1px; background: var(--line-2); }
.conf .bars i:nth-child(1) { height: 6px; } .conf .bars i:nth-child(2) { height: 9px; } .conf .bars i:nth-child(3) { height: 12px; }
.conf .bars i.on { background: var(--c); }
.conf-3 { --c: var(--green); } .conf-2 { --c: var(--amber); } .conf-1 { --c: var(--coral); }

/* Estructura */
main { max-width: 1280px; margin: 0 auto; padding: 22px 20px; display: grid; gap: 20px; }
section { background: linear-gradient(180deg, rgba(255, 255, 255, .018), transparent 120px), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; scroll-margin-top: 120px; box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px -18px rgba(0, 0, 0, .6); }
.sh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 16px; }
.sh .badge { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); }
.sh h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; font-weight: 650; }
.sh .sub { flex-basis: 100%; margin-top: -4px; padding-left: 44px; }
h3 { display: flex; align-items: center; gap: 8px; font-size: 11.5px; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 650; }
h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.banner { display: grid; grid-template-columns: auto 1fr; gap: 12px; border-radius: var(--radius); padding: 14px 16px; color: var(--text);
  background: linear-gradient(90deg, rgba(251, 191, 36, .12), rgba(251, 191, 36, .04)); border: 1px solid rgba(251, 191, 36, .35); }
.banner > .ic { width: 20px; height: 20px; color: var(--amber); margin-top: 2px; }
.banner ul { margin: 4px 0 0; padding-left: 20px; color: #e2e8f0; font-size: 14px; }
.empty { display: flex; gap: 12px; align-items: flex-start; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 12px; padding: 16px; background: rgba(15, 22, 40, .5); }
.empty > .ic { width: 20px; height: 20px; color: var(--faint); margin-top: 1px; }

/* Tarjetas de métricas */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.overview .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tile { --c: var(--blue-t); position: relative; overflow: hidden; border-radius: 12px; padding: 14px 14px 13px; border: 1px solid var(--line);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 9%, var(--panel-2)) 0%, var(--panel-2) 65%); transition: border-color .2s, transform .2s; }
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--c), transparent 85%); }
.tile:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); transform: translateY(-1px); }
.tile .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile .l { font-size: 12.5px; color: var(--muted); font-weight: 500; line-height: 1.3; }
.tile .ti { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); flex: none; }
.tile .ti .ic { width: 15px; height: 15px; }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin-top: 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .v.text { font-size: 15px; font-weight: 600; letter-spacing: 0; line-height: 1.35; margin-top: 12px; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile .na { display: inline-block; font-size: 14px; font-weight: 500; color: var(--faint); border: 1px dashed var(--line-2); border-radius: 6px; padding: 1px 8px; letter-spacing: 0; cursor: help; }
.meter { height: 6px; border-radius: 99px; background: rgba(148, 163, 184, .14); overflow: hidden; margin-top: 8px; }
.meter > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, transparent), var(--c)); }

/* Gráficos */
.overview { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; align-items: stretch; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.donut-box { display: grid; justify-items: center; align-content: center; gap: 14px; }
.donut-box > .empty { grid-column: 1 / -1; justify-self: stretch; }
.donut-wrap { position: relative; width: 168px; height: 168px; }
.donut { width: 100%; height: 100%; }
.donut circle { fill: none; stroke-width: 14; }
.donut .track { stroke: rgba(148, 163, 184, .12); }
.donut .seg { transition: stroke-width .15s; cursor: default; }
.donut .seg:hover { stroke-width: 17; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center .big { font-size: 30px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
.donut-center .cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend { display: grid; gap: 6px; width: 100%; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; }
.card h4 { margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dist { display: grid; gap: 12px; }
.dist-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 150px; gap: 14px; align-items: center; }
.dist-row.zero { opacity: .55; }
.track { height: 10px; background: rgba(148, 163, 184, .1); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, transparent), var(--c)); box-shadow: 0 0 12px -2px color-mix(in srgb, var(--c) 60%, transparent); transition: width .4s ease; }
.dist-row .small { text-align: right; font-variant-numeric: tabular-nums; }
.stack { display: flex; gap: 3px; height: 14px; border-radius: 99px; overflow: hidden; background: rgba(148, 163, 184, .1); }
.stack > div { background: var(--c); min-width: 4px; }
.split-legend { display: grid; gap: 10px; margin-top: 16px; }
.split-legend .row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.split-legend .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.split-legend .pc { color: var(--muted); font-size: 12px; margin-left: 4px; font-weight: 500; }

/* Resumen de la IA y textos largos */
.ai-panel { position: relative; border-radius: 12px; padding: 14px 16px; background: linear-gradient(135deg, rgba(167, 139, 250, .10), rgba(34, 211, 238, .04) 70%); border: 1px solid rgba(167, 139, 250, .3); }
.ai-panel pre { background: transparent; border: 0; padding: 0; max-height: 360px; color: #e2e8f0; }
.label { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; }
.label .note { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px; }
.ai-panel .label, .rec-ia .label { color: var(--violet); }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 var(--mono); color: #cbd5e1; background: var(--panel-3); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); max-height: 420px; overflow: auto; }

/* Filtros y grupos */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; padding: 14px; margin-bottom: 12px; background: var(--panel-3); border: 1px solid var(--line); border-radius: 12px; }
.filters label { display: grid; gap: 5px; font-size: 12px; font-weight: 500; color: var(--muted); }
.listbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
.listbar p { margin: 0; }
details.group { position: relative; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: var(--panel-2); overflow: hidden; transition: border-color .15s, background .15s, box-shadow .15s; }
details.group::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
details.group:hover { border-color: var(--line-2); background: #1d2740; }
details.group[open] { border-color: color-mix(in srgb, var(--c) 40%, var(--line)); box-shadow: 0 12px 30px -20px color-mix(in srgb, var(--c) 70%, transparent); }
details.group > summary { cursor: pointer; padding: 13px 16px 13px 18px; display: grid; grid-template-columns: 52px auto minmax(0, 1fr) auto 18px; gap: 6px 14px; align-items: center; list-style: none; }
details.group > summary::-webkit-details-marker { display: none; }
details.group[open] > summary { border-bottom: 1px solid var(--line); background: rgba(15, 22, 40, .45); }
.chev { color: var(--faint); transition: transform .2s; }
details[open] > summary .chev { transform: rotate(180deg); color: var(--text); }
.gid { font: 700 13px var(--mono); color: var(--text); }
.tags { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fp { font: 12.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-size: 13px; }
.count { display: inline-flex; align-items: baseline; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.count span { font-weight: 500; color: var(--muted); font-size: 12px; }
.body { padding: 16px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.stackv { display: grid; gap: 12px; min-width: 0; }
.box { border-radius: 11px; padding: 12px 14px; background: var(--panel-3); border: 1px solid var(--line); min-width: 0; }
.box p { margin: 0; overflow-wrap: anywhere; }
.box.ev { border-color: rgba(34, 211, 238, .3); background: linear-gradient(135deg, rgba(34, 211, 238, .08), transparent 70%), var(--panel-3); }
.box.ev .label { color: var(--cyan); }
.box.rec { border-color: rgba(96, 165, 250, .35); background: linear-gradient(135deg, rgba(59, 130, 246, .12), transparent 70%), var(--panel-3); }
.box.rec .label { color: var(--blue-t); }
.box.rec-ia { border-color: rgba(167, 139, 250, .4); background: linear-gradient(135deg, rgba(167, 139, 250, .14), rgba(34, 211, 238, .04) 75%), var(--panel-3); }
.box.rec p { font-weight: 500; color: #f8fafc; }
.box.err { border-color: rgba(251, 113, 133, .3); }
.box.err .label { color: var(--coral); }
.box.err pre { border: 0; border-left: 2px solid var(--coral); border-radius: 0 8px 8px 0; background: rgba(251, 113, 133, .05); }
.box details > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.box details[open] > summary { margin-bottom: 8px; }
ul.tests { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
ul.tests li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 8px; border-radius: 7px; }
ul.tests li:nth-child(odd) { background: rgba(148, 163, 184, .05); }
.loc { font: 12px var(--mono); color: var(--faint); }
.side { background: var(--panel-3); border: 1px solid var(--line); border-radius: 11px; padding: 4px 14px; }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; margin: 0; }
.side .kv { grid-template-columns: 1fr; gap: 0; }
.kv dt { color: var(--muted); font-size: 12px; font-weight: 500; }
.side .kv dt { padding-top: 10px; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--faint); }
.kv dd { margin: 0; overflow-wrap: anywhere; font-size: 14px; }
.side .kv dd { padding: 3px 0 10px; border-bottom: 1px solid var(--line); }
.side .kv dd:last-child { border-bottom: 0; }

/* Recomendaciones */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 11px; background: rgba(59, 130, 246, .07); border: 1px solid rgba(96, 165, 250, .25); font-size: 14px; }
.notice > .ic { color: var(--blue-t); margin-top: 3px; }
.ticket { border: 1px solid var(--line); border-left: 3px solid var(--bug_producto); border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel-2); }
.ticket strong { display: flex; gap: 8px; align-items: center; }
.ticket strong .ic { color: var(--bug_producto); }
.ticket ul { margin: 4px 0; padding-left: 20px; }

/* Tablas */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-3); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 11px; color: var(--faint); font-weight: 650; text-transform: uppercase; letter-spacing: .07em; background: rgba(148, 163, 184, .04); white-space: nowrap; }
tbody tr { transition: background .15s; }
tbody tr:hover td { background: rgba(148, 163, 184, .05); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.sel td { background: rgba(34, 211, 238, .06); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--cyan); }
.mini { display: flex; gap: 2px; height: 8px; width: 120px; border-radius: 99px; overflow: hidden; background: rgba(148, 163, 184, .12); margin-top: 4px; }
.mini > div { background: var(--c); }
.hit { --c: var(--slate); display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--c); }
.hit-ok { --c: var(--green); } .hit-ko { --c: var(--coral); }
.sdot { display: inline-flex; align-items: center; gap: 7px; }
.sdot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--slate)); }

/* Evaluación e historial */

.hchart { display: flex; justify-content: space-around; gap: 10px; height: 196px; padding: 12px 6px 0; overflow-x: auto; }
.hcol { flex: 1 0 44px; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border-radius: 8px 8px 0 0; padding: 0 4px; transition: background .15s; }
.hcol:hover, .hcol.sel { background: rgba(148, 163, 184, .07); }

.hcol .b { width: 14px; min-height: 2px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 45%, transparent)); }
.hdate { font-size: 11px; color: var(--faint); white-space: nowrap; padding-bottom: 4px; }

.tone-amber { --c: var(--amber); } .tone-coral { --c: var(--coral); } .tone-slate { --c: var(--slate); }

function fmtDate(v) {
  if (!v) return null;

const run = () => DATA.runs[state.run];

function selectRun(i) { state.run = i; state.filters = noFilters(); renderHeader(); renderRun(); }

function runStatus(t) {

  if (t.failed) return ["coral", "Con fallos", detail];

// Anillo SVG: un segmento por parte con valor; el <title> de cada segmento hace de tooltip.
function donut(parts, center, caption, aria) {

}

  return h("li", {}, sw, h("span", { class: "muted" }, p.label), h("span", { class: "n" }, p.v));
}));

function renderSummary() {

  fill("artefactos",
    head("folder", "Artefactos leídos", "slate"),
    r.source === "historial" ? h("p", { class: "small muted" }, "Copia guardada en qa-history/: refleja el estado de los artefactos cuando se guardó.") : null,
    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Fichero"), h("th", {}, "Estado"), h("th", {}, "Vínculo con la ejecución"))),
      h("tbody", {}, r.artifacts.map((a) => h("tr", {}, h("td", {}, code(a.name)),
        h("td", {}, tone(STATUS_TONE[a.status] ?? "coral", h("span", { class: "sdot" }, STATUS[a.status] ?? a.status))),
        h("td", { class: "small" }, a.link ? tone(LINK_TONE[a.link] ?? "slate", h("span", { class: "sdot" }, LINK[a.link])) : "—")))))));
}

function renderDefinitions() {
  const def = (k, v) => [h("dt", {}, k), h("dd", {}, v)];
  fill("definiciones", h("details", {}, h("summary", {}, h("span", { class: "sh", style: "margin:0" }, h("span", { class: "badge tone-slate" }, icon("book"))), "Cómo se calcula cada indicador", h("span", { class: "spacer" }), h("span", { class: "chev" }, icon("chevron"))),
    h("dl", { class: "kv", style: "margin-top:16px" },
      def("Tests", "Contadores de stats de test-results.json: cada test cuenta una vez por navegador. Total = pasados + fallidos + omitidos + flaky."),
      def("Éxito", "Pasados / (total − omitidos). Los flaky no cuentan como éxito: fallaron al menos una vez."),
      def("Grupos", "Grupos de ai-failures-grouped.json. Un grupo es una causa; su número no se suma con el de tests."),
      def("Tests en los grupos", "Suma de count de cada grupo: fallidos más flaky de la ejecución."),
      def("Determinista", "Grupos flaky: los marca triage.mjs sin IA (fallaron y pasaron al reintentar)."),
      def("Clasificados por IA", "Grupos test_roto, bug_producto o entorno: los asigna la IA en report:ai."),
      def("sin_clasificar", "La llamada de clasificación falló o el informe no trae tipo."),
      def("Pendientes de revisión", "Los artefactos no guardan revisiones. Se marcan los sin_clasificar y los de IA con confianza media, baja o sin confianza."),
      def("Peticiones a la IA", "ai_requests de ai-failures-grouped.json: peticiones de report:ai al proveedor, reintentos incluidos. No hay datos de tokens ni de coste."),
      def("Vínculo", "El análisis se asocia a la ejecución por run_start_time. Los ficheros sin identificador (resumen, correcciones, tickets) solo se aceptan si son posteriores a test-results.json."),
      def("Acierto de la IA", "De ai-eval.json (npm run eval:ai): grupos bien clasificados / grupos evaluados, y lo mismo ponderado por tests."))));
}

function renderRun() {
  renderWarnings(); renderSummary(); renderDistribution(); renderGroups(); renderRecommendations(); renderHistory(); renderArtifacts();
}

// Marco fijo: logo, insignia e iconos de la navegación, que resalta la sección visible.
document.getElementById("logo").append(icon("shield"));
document.getElementById("safe").prepend(icon("lock"));
const tabs = [...document.querySelectorAll(".tabs a")];
for (const a of tabs) a.prepend(icon(a.dataset.icon));
const spy = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) tabs.forEach((a) => a.classList.toggle("active", a.hash === `#${e.target.id}`));
}, { rootMargin: "-30% 0px -60% 0px" });
for (const a of tabs) spy.observe(document.querySelector(a.hash));

renderHeader(); renderRun(); renderEval(); renderDefinitions();
fill("footer", icon("shield"), h("span", {}, `Generado ${fmtDate(DATA.generatedAt)} por scripts/dashboard.mjs a partir de los artefactos existentes. La página no llama a ningún modelo ni se conecta a la red.`));
</script>
</body>
</html>
